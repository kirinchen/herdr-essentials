[package]
name = "k-float"
version = "0.2.0"
edition = "2021"
description = "Opens always-on-top desktop windows (system webview) from spec files. Helper for the k-float mod SDK."
license = "Apache-2.0"
publish = false

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"   # the same one tao uses: asks whether the desktop blends windows

[profile.release]
opt-level = "s"
lto = true
strip = true
